<mat-card>
  @if (isLoading) {
    <div class="cards-loading">
      <mat-spinner diameter="24"></mat-spinner>
      <span>Carregando usuarios...</span>
    </div>
  }

  @if (usersError) {
    <p class="cards-error">{{ usersError }}</p>
  }

  @if (!isLoading && !usersError && users().length === 0) {
    <p class="cards-empty">Nenhum usuario encontrado.</p>
  }

  @if (!isLoading && users().length > 0) {
    <table mat-table [dataSource]="users()" class="mat-elevation-z8">
      <ng-container matColumnDef="icon">
        <th mat-header-cell *matHeaderCellDef> </th>
        <td mat-cell *matCellDef="let user">
          <mat-icon aria-hidden="false" aria-label="User" fontIcon="person"></mat-icon>
        </td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef> </th>
        <td mat-cell *matCellDef="let user"> {{ user.name }} </td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef> </th>
        <td mat-cell *matCellDef="let user"> {{ user.email }} </td>
      </ng-container>

      <ng-container matColumnDef="action">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let user">
          <button mat-icon-button aria-label="Editar usuario" (click)="openEditDialog(user)">
            <mat-icon>edit</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="column"></tr>
      <tr mat-row *matRowDef="let row; columns: column;"></tr>
    </table>
  }
</mat-card>
